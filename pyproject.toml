[project]
name = "agentic-lms"
version = "0.1.0"
description = "Agentic AI 핸즈온 학습 가이드와 AI 도우미 서버"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []          # 도우미 서버는 표준 라이브러리만 쓴다

[dependency-groups]
dev = ["playwright"]       # 시험용 (uv sync 때 기본으로 설치된다)

[tool.uv]
package = false            # 라이브러리로 설치하지 않는 앱 프로젝트
