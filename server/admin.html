<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도우미 봇 강사 설정</title>
<style>body{font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;max-width:820px;margin:1.5rem auto;padding:0 1rem;color:#1d2327;background:#f6f5f1;line-height:1.55}
h1{font-size:1.3rem}h2{font-size:1.05rem;margin-top:1.5rem}.card{background:#fff;border:1px solid #d9d5c8;border-radius:10px;padding:.9rem 1rem;margin:.6rem 0}
label{display:block;font-size:.85rem;color:#555;margin-top:.5rem}input,select,textarea{width:100%;padding:.4rem .5rem;border:1px solid #bbb;border-radius:6px;font:inherit;box-sizing:border-box}
button{padding:.4rem .9rem;border:1px solid #0f6b5c;background:#0f6b5c;color:#fff;border-radius:6px;font:inherit;cursor:pointer}button.s{background:#fff;color:#0f6b5c}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:150px}.ok{color:#1b8a47;font-weight:700}.no{color:#b42318;font-weight:700}table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{border:1px solid #ddd;padding:.3rem .5rem;text-align:left}.m{font-size:.85rem;color:#666}</style></head><body>
<h1>도우미 봇 강사 설정</h1><p class="m">이 화면은 강사 PC에서만 열린다. 키는 서버 메모리에만 두며 파일에 저장하지 않는다. 키를 파일로 두려면 server/.env를 쓴다.</p>
<div class="card"><label>관리 토큰 (서버를 시작할 때 터미널에 출력된 값)</label><div class="row"><input id="tok" type="password" autocomplete="off"><button id="load">불러오기</button></div></div>
<div id="app" style="display:none">
<h2>강사 검토함</h2><div class="card"><p class="m">막힌 지 15분 이상, 환경 문제, 가이드에 근거가 없는 질문은 AI 초안이 여기에 쌓인다. 수강자에게는 답이 "강사 검토 전"으로 먼저 보인다. 고쳐서 전달하면 그 수강자 화면에 "강사 답변"으로 도착한다.</p><button class="s" id="rvRefresh">새로고침</button> <span class="m" id="rvCount"></span><div id="rv"></div></div>
<h2>현재 제공자</h2><div class="card"><div class="row"><div><label>사용할 제공자</label><select id="prov"></select></div><div><label>실패 시 대신 쓸 제공자</label><select id="fb"></select></div><button id="apply">적용</button></div><p class="m" id="applyMsg"></p></div>
<h2>제공자별 설정</h2><div id="provs"></div>
<h2>사용 현황</h2><div class="card"><button class="s" id="refresh">새로고침</button><div id="stats"></div></div></div>
<script>
var TOK='',CFG=null,KEYS={};function $(i){return document.getElementById(i)}
function api(m,p,b){return fetch(p,{method:m,headers:{'Content-Type':'application/json','X-Admin-Token':TOK},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json()})}
function E(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function load(){TOK=$('tok').value;sessionStorage.setItem('t',TOK);api('GET','/api/admin/config').then(function(d){if(!d.ok){alert('토큰이 올바르지 않다');return}CFG=d.config;KEYS=d.keys;draw(d.providers);$('app').style.display='block';stats();review()})}
function review(){api('GET','/api/admin/review').then(function(d){if(!d.ok)return;
 var dr=d.items.filter(function(x){return x.status==='draft'}).reverse(),dn=d.items.filter(function(x){return x.status==='delivered'}).reverse();
 $('rvCount').textContent='초안 '+dr.length+'건 · 전달됨 '+dn.length+'건';
 function item(x){var dr=x.status==='draft';return '<div class="card"><b>단계 '+E(x.step)+'</b> · 수강자 '+E(x.who)+' · '+E(x.ts)+' · <span class="no">'+E(x.labels.join(', '))+'</span>'+(x.stuck_min?' · 막힌 지 '+x.stuck_min+'분':'')+'<p><b>질문</b> '+E(x.q)+'</p><label>'+(dr?'AI 초안 (고쳐서 전달한다)':'전달한 답 (다시 고쳐 보낼 수 있다)')+'</label><textarea id="rt_'+x.id+'" rows="5">'+E(dr?x.draft:x.text)+'</textarea><div class="row"><button data-d="'+x.id+'">'+(dr?'전달':'다시 전달')+'</button><span class="m" id="rm_'+x.id+'">'+(dr?'':'전달됨 '+E(x.delivered_ts))+'</span></div></div>'}
 $('rv').innerHTML='<b>초안 (강사 확인 전)</b>'+(dr.length?dr.map(item).join(''):'<p class="m">없음</p>')+'<b>전달됨</b>'+(dn.length?dn.map(item).join(''):'<p class="m">없음</p>')})}
$('rvRefresh').onclick=review;setInterval(function(){if(TOK&&!(document.activeElement&&document.activeElement.tagName==='TEXTAREA'))review()},15000);
function draw(P){var o=P.map(function(p){return '<option>'+p+'</option>'}).join('');$('prov').innerHTML=o;$('prov').value=CFG.provider;$('fb').innerHTML='<option value="">없음</option>'+o;$('fb').value=(CFG.fallback||[])[0]||'';
 var h='';P.forEach(function(p){if(p==='mock'){h+='<div class="card"><b>mock</b><p class="m">키 없이 규칙 기반으로 에이전트 구조를 시연한다. 네트워크가 필요 없다.</p></div>';return}
 h+='<div class="card"><b>'+p+'</b> <span class="'+(KEYS[p]?'ok':'no')+'" id="k_'+p+'">'+(KEYS[p]?'키 있음':'키 없음')+'</span><div class="row"><div><label>모델 (확인 필요)</label><input id="m_'+p+'" value="'+E(CFG.models[p])+'"></div><div><label>주소</label><input id="u_'+p+'" value="'+E(CFG.base_urls[p])+'"></div></div><div class="row"><div><label>API 키 (이 서버 실행 중에만 유지)</label><input id="key_'+p+'" type="password" autocomplete="off" placeholder="비우고 적용하면 입력한 키를 지운다"></div><button data-k="'+p+'">키 적용</button><button class="s" data-m="'+p+'">모델·주소 저장</button><button class="s" data-t="'+p+'">연결 시험</button></div><p class="m" id="r_'+p+'"></p></div>'});$('provs').innerHTML=h}
$('load').onclick=load;if(sessionStorage.getItem('t')){$('tok').value=sessionStorage.getItem('t');load()}
$('apply').onclick=function(){var fb=$('fb').value;api('POST','/api/admin/config',{provider:$('prov').value,fallback:fb?[fb]:[]}).then(function(d){$('applyMsg').textContent=d.ok?'적용했다. 다음 질문부터 바뀐다.':d.msg})}
document.addEventListener('click',function(e){var t=e.target,p;
 if(p=t.getAttribute('data-d')){api('POST','/api/admin/review/deliver',{id:p,text:$('rt_'+p).value}).then(function(d){if(d.ok)review();else $('rm_'+p).textContent='실패: '+d.msg})}
 if(p=t.getAttribute('data-k')){api('POST','/api/admin/key',{provider:p,key:$('key_'+p).value}).then(function(d){$('key_'+p).value='';KEYS[p]=d.has_key;$('k_'+p).className=d.has_key?'ok':'no';$('k_'+p).textContent=d.has_key?'키 있음':'키 없음'})}
 if(p=t.getAttribute('data-m')){var m={},u={};m[p]=$('m_'+p).value;u[p]=$('u_'+p).value;api('POST','/api/admin/config',{models:m,base_urls:u}).then(function(){$('r_'+p).textContent='저장했다'})}
 if(p=t.getAttribute('data-t')){$('r_'+p).textContent='시험 중...';api('POST','/api/admin/test',{provider:p}).then(function(d){$('r_'+p).textContent=d.ok?('성공 '+d.ms+'ms: '+d.sample):('실패: '+d.msg)})}});
function stats(){api('GET','/api/admin/stats').then(function(d){if(!d.ok)return;function T(a){return a.length?'<table>'+a.map(function(x){return '<tr><td>'+E(x[0])+'</td><td>'+x[1]+'</td></tr>'}).join('')+'</table>':'<p class="m">없음</p>'}
 $('stats').innerHTML='<p>질문 '+d.total+'건, 사용자 '+d.sessions+'명, 오류 '+d.errors+'건</p><b>단계별 질문</b>'+T(d.by_step)+'<b>많이 찾은 증상</b>'+T(d.top_symptoms)+'<b>도구 호출</b>'+T(d.tools)+'<b>일치하는 증상이 없던 질문 (가이드 보강 후보)</b><ul>'+d.unmatched.map(function(q){return '<li>'+E(q)+'</li>'}).join('')+'</ul>'})}
$('refresh').onclick=stats;</script></body></html>
